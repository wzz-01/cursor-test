<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>经营简报</title>
  <style>
    :root {
      --navy: #0b3a6e;
      --blue: #1a66c4;
      --blue-soft: #e8f1fb;
      --ink: #1c2430;
      --muted: #5f6b7a;
      --line: #d9e2ec;
      --bg: #f4f7fb;
      --card: #ffffff;
      --green: #1f8a5b;
      --red: #c0392b;
      --orange: #c77700;
      --warn-bg: #fdecec;
      --action-bg: #fff4e6;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: "WenQuanYi Micro Hei", "Droid Sans Fallback", "PingFang SC", sans-serif;
      background: #cfd8e3;
      color: var(--ink);
      -webkit-font-smoothing: antialiased;
    }

    .page {
      width: 860px;
      margin: 0 auto;
      background: linear-gradient(180deg, #f7fafc 0%, #eef3f8 100%);
      padding: 28px 28px 22px;
    }

    .header {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 12px;
      align-items: start;
      margin-bottom: 14px;
    }

    .brand {
      font-size: 34px;
      font-weight: 800;
      color: var(--navy);
      letter-spacing: 1px;
      line-height: 1.15;
    }

    .meta {
      margin-top: 8px;
      color: var(--muted);
      font-size: 13px;
      line-height: 1.6;
    }

    .time-box {
      background: var(--navy);
      color: #fff;
      border-radius: 10px;
      padding: 10px 14px;
      text-align: center;
      min-width: 96px;
    }
    .time-box .label { font-size: 11px; opacity: 0.85; }
    .time-box .value { font-size: 22px; font-weight: 700; margin-top: 2px; }

    .headline {
      background: linear-gradient(90deg, #0b3a6e, #1a66c4);
      color: #fff;
      border-radius: 12px;
      padding: 14px 16px;
      font-size: 14px;
      line-height: 1.65;
      margin-bottom: 16px;
      box-shadow: 0 8px 18px rgba(11, 58, 110, 0.18);
    }
    .headline::before {
      content: "核心结论";
      display: inline-block;
      background: rgba(255,255,255,0.18);
      border-radius: 999px;
      padding: 2px 10px;
      font-size: 12px;
      margin-right: 8px;
      vertical-align: baseline;
    }

    .kpi-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 12px;
      margin-bottom: 16px;
    }

    .kpi {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 14px;
      padding: 14px 12px 12px;
      position: relative;
      overflow: hidden;
    }
    .kpi::after {
      content: "";
      position: absolute;
      left: 0; top: 0; bottom: 0;
      width: 4px;
      background: var(--blue);
    }
    .kpi.tone-warn::after { background: var(--orange); }
    .kpi.tone-danger::after { background: var(--red); }
    .kpi .label { font-size: 12px; color: var(--muted); }
    .kpi .value {
      margin-top: 6px;
      font-size: 28px;
      font-weight: 800;
      color: var(--navy);
      line-height: 1.1;
    }
    .kpi .sub { margin-top: 6px; font-size: 12px; color: var(--muted); }
    .kpi .badge {
      display: inline-block;
      margin-top: 8px;
      font-size: 11px;
      padding: 3px 8px;
      border-radius: 999px;
      background: var(--blue-soft);
      color: var(--blue);
      font-weight: 600;
    }
    .kpi.tone-danger .badge { background: #fde8e6; color: var(--red); }
    .kpi.tone-warn .badge { background: #fff1db; color: var(--orange); }

    .section {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 14px;
      padding: 16px;
      margin-bottom: 12px;
    }

    .section-title {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 12px;
    }
    .section-title .num {
      width: 28px; height: 28px;
      border-radius: 8px;
      background: var(--navy);
      color: #fff;
      display: grid;
      place-items: center;
      font-size: 12px;
      font-weight: 700;
    }
    .section-title h2 {
      font-size: 16px;
      color: var(--navy);
      font-weight: 700;
    }

    .bars { display: grid; gap: 10px; }
    .bar-row { display: grid; grid-template-columns: 120px 1fr 70px; gap: 10px; align-items: center; }
    .bar-name { font-size: 13px; color: var(--ink); }
    .bar-track {
      height: 12px;
      background: #edf2f7;
      border-radius: 999px;
      overflow: hidden;
    }
    .bar-fill {
      height: 100%;
      border-radius: 999px;
      background: linear-gradient(90deg, #1a66c4, #4f8fe0);
    }
    .bar-fill.low { background: linear-gradient(90deg, #c0392b, #e07468); }
    .bar-fill.mid { background: linear-gradient(90deg, #c77700, #e0a84a); }
    .bar-rate { font-size: 13px; font-weight: 700; text-align: right; color: var(--navy); }
    .bar-note { grid-column: 2 / 4; font-size: 11px; color: var(--muted); margin-top: -4px; }

    .chip-wrap { display: flex; flex-wrap: wrap; gap: 8px; }
    .chip {
      background: var(--blue-soft);
      color: var(--blue);
      border-radius: 999px;
      padding: 6px 10px;
      font-size: 12px;
      font-weight: 600;
    }
    .chip.danger { background: #fde8e6; color: var(--red); }
    .chip.muted { background: #eef2f6; color: var(--muted); }

    .two-col {
      display: grid;
      grid-template-columns: 1.1fr 0.9fr;
      gap: 12px;
    }

    .stat-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
    }
    .stat {
      background: var(--bg);
      border-radius: 12px;
      padding: 12px;
    }
    .stat .k { font-size: 12px; color: var(--muted); }
    .stat .v { margin-top: 4px; font-size: 20px; font-weight: 800; color: var(--navy); }
    .stat .s { margin-top: 4px; font-size: 11px; color: var(--muted); }

    .list {
      list-style: none;
      display: grid;
      gap: 8px;
    }
    .list li {
      background: var(--bg);
      border-radius: 10px;
      padding: 10px 12px;
      font-size: 12px;
      line-height: 1.55;
      color: var(--ink);
    }
    .list li strong { color: var(--navy); }

    .bottom-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin-top: 4px;
    }
    .box {
      border-radius: 14px;
      padding: 14px;
      border: 1px solid transparent;
    }
    .box.warn { background: var(--warn-bg); border-color: #f3c6c2; }
    .box.action { background: var(--action-bg); border-color: #f0d2a0; }
    .box h3 {
      font-size: 14px;
      margin-bottom: 10px;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .box.warn h3 { color: var(--red); }
    .box.action h3 { color: var(--orange); }
    .box ol, .box ul {
      padding-left: 18px;
      display: grid;
      gap: 7px;
      font-size: 12px;
      line-height: 1.55;
    }

    .footer {
      margin-top: 10px;
      color: var(--muted);
      font-size: 11px;
      line-height: 1.6;
      text-align: center;
    }
  </style>
</head>
<body>
  <div class="page" id="page">
    <div class="header">
      <div>
        <div class="brand" id="title">经营简报</div>
        <div class="meta" id="meta"></div>
      </div>
      <div class="time-box">
        <div class="label">晨报时点</div>
        <div class="value" id="clock">08:00</div>
      </div>
    </div>

    <div class="headline" id="headline"></div>
    <div class="kpi-grid" id="kpis"></div>

    <div class="section">
      <div class="section-title"><div class="num">01</div><h2 id="s1-title">销售组达成对比</h2></div>
      <div class="bars" id="bars"></div>
    </div>

    <div class="two-col">
      <div class="section">
        <div class="section-title"><div class="num">02</div><h2 id="s2-title">连续三月同比下滑</h2></div>
        <div style="margin-bottom:10px;font-size:12px;color:var(--muted);">下滑城市</div>
        <div class="chip-wrap" id="cities" style="margin-bottom:12px;"></div>
        <div style="margin-bottom:10px;font-size:12px;color:var(--muted);">下滑销售组</div>
        <div class="chip-wrap" id="groups" style="margin-bottom:12px;"></div>
        <div style="margin-bottom:10px;font-size:12px;color:var(--muted);">近三月达成率全国后20%销售组</div>
        <div class="chip-wrap" id="bottom20"></div>
      </div>
      <div class="section">
        <div class="section-title"><div class="num">02</div><h2>下滑客户</h2></div>
        <ul class="list" id="customers"></ul>
      </div>
    </div>

    <div class="section">
      <div class="section-title"><div class="num">03</div><h2 id="s3-title">年累计进度</h2></div>
      <div class="stat-grid" id="progress"></div>
    </div>

    <div class="section">
      <div class="section-title"><div class="num">04</div><h2 id="s4-title">昨日订单</h2></div>
      <div class="stat-grid" id="orders" style="margin-bottom:12px;"></div>
      <div style="margin-bottom:8px;font-size:12px;color:var(--muted);">昨日下单客户</div>
      <ul class="list" id="order-customers"></ul>
    </div>

    <div class="bottom-grid">
      <div class="box warn">
        <h3>经营预警</h3>
        <ol id="warnings"></ol>
      </div>
      <div class="box action">
        <h3>今日关键动作</h3>
        <ol id="actions"></ol>
      </div>
    </div>

    <div class="footer" id="footer"></div>
  </div>

  <script id="briefing-data" type="application/json">__DATA_JSON__</script>
  <script>
    function esc(s) {
      return String(s ?? "").replace(/[&<>"']/g, (c) => ({
        "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
      })[c]);
    }

    function barClass(rate) {
      if (rate == null) return "mid";
      if (rate < 60) return "low";
      if (rate < 80) return "mid";
      return "";
    }

    const data = JSON.parse(document.getElementById("briefing-data").textContent);
    document.getElementById("title").textContent = data.meta.title;
    document.getElementById("meta").innerHTML =
      `${esc(data.meta.subtitle)} · ${esc(data.meta.region)}<br/>数据截至 ${esc(data.meta.as_of_date)} · 生成于 ${esc(data.meta.generated_at)} · ${esc(data.meta.owner)}`;
    document.getElementById("clock").textContent = (data.meta.generated_at || "08:00").slice(-5);
    document.getElementById("headline").append(document.createTextNode(data.headline));

    document.getElementById("kpis").innerHTML = data.kpis.map((k) => `
      <div class="kpi tone-${esc(k.tone || "")}">
        <div class="label">${esc(k.label)}</div>
        <div class="value">${esc(k.value)}</div>
        <div class="sub">${esc(k.sub || "")}</div>
        <div class="badge">${esc(k.badge || "")}</div>
      </div>
    `).join("");

    document.getElementById("s1-title").textContent = data.section_01.title;
    document.getElementById("bars").innerHTML = data.section_01.items.map((item) => {
      const rate = item.rate;
      const width = rate == null ? 35 : Math.max(8, Math.min(100, rate));
      const rateText = rate == null ? "—" : `${rate.toFixed(1)}%`;
      return `
        <div class="bar-row">
          <div class="bar-name">${esc(item.name)}</div>
          <div class="bar-track"><div class="bar-fill ${barClass(rate)}" style="width:${width}%"></div></div>
          <div class="bar-rate">${rateText}</div>
          <div class="bar-note">${esc(item.note || "")}</div>
        </div>
      `;
    }).join("");

    document.getElementById("s2-title").textContent = data.section_02.title;
    document.getElementById("cities").innerHTML = data.section_02.cities.map((c) => `<span class="chip danger">${esc(c)}</span>`).join("");
    document.getElementById("groups").innerHTML = data.section_02.groups.map((c) => `<span class="chip danger">${esc(c)}</span>`).join("");
    document.getElementById("bottom20").innerHTML = data.section_02.bottom20_groups.map((c) => `<span class="chip">${esc(c)}</span>`).join("");
    document.getElementById("customers").innerHTML = data.section_02.customers.map((c) => `<li>${esc(c)}</li>`).join("");

    document.getElementById("s3-title").textContent = data.section_03.title;
    const p = data.section_03;
    document.getElementById("progress").innerHTML = `
      <div class="stat"><div class="k">年累计销额</div><div class="v">${esc(p.sales)}</div><div class="s">增额 ${esc(p.delta)}</div></div>
      <div class="stat"><div class="k">累计进度</div><div class="v">${esc(p.progress)}</div><div class="s">同期实际 ${esc(p.peer_progress)}</div></div>
      <div class="stat"><div class="k">同比增速</div><div class="v">${esc(p.yoy)}</div><div class="s">进度第${esc(p.progress_rank)} / 增速第${esc(p.growth_rank)}</div></div>
    `;

    document.getElementById("s4-title").textContent = data.section_04.title;
    const o = data.section_04;
    document.getElementById("orders").innerHTML = `
      <div class="stat"><div class="k">昨日下单额</div><div class="v">${esc(o.order_amount)}</div><div class="s">下单量 ${esc(o.order_qty)}</div></div>
      <div class="stat"><div class="k">占全月预算</div><div class="v">${esc(o.budget_share)}</div><div class="s">预算分母 ${esc(o.budget_base)}</div></div>
      <div class="stat"><div class="k">连续5日未下单组</div><div class="v">${o.no_order_groups_5d?.length ? o.no_order_groups_5d.join("、") : "无"}</div><div class="s">当月未下单客户：${o.no_order_customers_month?.length ? "有" : "无"}</div></div>
    `;
    document.getElementById("order-customers").innerHTML = o.yesterday_customers.map((c) => `
      <li><strong>${esc(c.code)} ${esc(c.name)}</strong><br/>${esc(c.group)} · 下单额 ${esc(c.amount)} · 下单量 ${esc(c.qty)}</li>
    `).join("");

    document.getElementById("warnings").innerHTML = data.warnings.map((w) => `<li>${esc(w)}</li>`).join("");
    document.getElementById("actions").innerHTML = data.actions.map((w) => `<li>${esc(w)}</li>`).join("");
    document.getElementById("footer").innerHTML =
      `${esc(data.footer.sources)}<br/>${esc(data.footer.note)} · ${esc(data.meta.owner)}`;
  </script>
</body>
</html>
